<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="controls-bar">
    <div class="lang-pill">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
        <path d="M2 10h16M10 2a8 8 0 0 1 0 16 8 8 0 0 1 0-16" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <select id="langSelect" class="lang-select" aria-label="Language">
        <option value="id">ID</option>
        <option value="en">EN</option>
        <option value="ja">JA</option>
        <option value="de">DE</option>
      </select>
    </div>
    <button id="themeToggle" class="theme-toggle" data-i18n-aria="theme.toggle" aria-label="Toggle theme">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 2v2M10 16v2M18 10h-2M4 10H2M15.657 4.343l-1.414 1.414M5.757 14.243l-1.414 1.414M15.657 15.657l-1.414-1.414M5.757 5.757L4.343 4.343" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M17 10.5A7 7 0 1 1 9.5 3a6 6 0 0 0 7.5 7.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <main class="container">

    <!-- Greeting -->
    <section class="card greeting-card">
      <div class="clock" id="clock">00:00:00</div>
      <div class="date" id="date"></div>
      <h1 class="greeting">
        <span id="greetingText"></span><span id="nameDisplay" class="name-accent"></span>
      </h1>
      <div id="nameEdit" class="name-edit hidden">
        <input id="nameInput" type="text" class="input" maxlength="30"
               data-i18n-placeholder="name.placeholder" placeholder="Your name">
      </div>
      <button id="nameEditBtn" class="link-btn" data-i18n="name.add">Add your name</button>
    </section>

    <!-- Two columns -->
    <div class="two-col">

      <!-- Timer -->
      <section class="card timer-card">
        <h2 data-i18n="timer.title">Focus Timer</h2>
        <div class="duration-presets">
          <button class="preset-btn" data-preset="15">15m</button>
          <button class="preset-btn" data-preset="25">25m</button>
          <button class="preset-btn" data-preset="45">45m</button>
          <button class="preset-btn" data-preset="60">60m</button>
        </div>
        <div class="stepper">
          <button id="decDuration" class="stepper-btn" data-i18n-aria="timer.decrease" aria-label="Decrease">−</button>
          <span id="durationDisplay">25 min</span>
          <button id="incDuration" class="stepper-btn" data-i18n-aria="timer.increase" aria-label="Increase">+</button>
        </div>
        <div class="timer-display" id="timerDisplay" aria-live="polite">25:00</div>
        <div class="timer-btns">
          <button id="startStopBtn" class="btn btn-primary" data-i18n="timer.start">Start</button>
          <button id="resetBtn"     class="btn btn-secondary" data-i18n="timer.reset">Reset</button>
        </div>
      </section>

      <!-- Tasks -->
      <section class="card tasks-card">
        <h2 data-i18n="tasks.title">To-Do List</h2>

        <!-- Progress bar -->
        <div id="progressWrap" class="progress-wrap hidden">
          <div class="progress-header">
            <span id="progressText" class="progress-text"></span>
            <span id="progressPct" class="progress-pct">0%</span>
          </div>
          <div class="progress-track"
               role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
               id="progressTrack">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>

        <div class="task-input-row">
          <input id="taskInput" type="text" class="input"
                 data-i18n-placeholder="tasks.placeholder" placeholder="Add a new task">
          <button id="addTaskBtn" class="btn btn-primary" data-i18n="tasks.add">Add</button>
        </div>
        <ul id="taskList" class="task-list"></ul>
        <p id="emptyState" class="empty-state" data-i18n="tasks.empty">No tasks yet. Enjoy the calm.</p>
      </section>

    </div>

    <!-- Quick Links -->
    <section class="card links-card">
      <h2 data-i18n="links.title">Quick Links</h2>
      <div class="link-input-row">
        <input id="linkName" type="text" class="input"
               data-i18n-placeholder="links.namePlaceholder" placeholder="Name">
        <input id="linkUrl" type="url" class="input"
               data-i18n-placeholder="links.urlPlaceholder" placeholder="https://example.com">
        <button id="addLinkBtn" class="btn btn-primary" data-i18n="links.add">Add Link</button>
      </div>
      <div id="linksList" class="links-list"></div>
    </section>

  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
